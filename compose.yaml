services:
  mongodb:
    image: mongo:8.3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - christopherbell_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  christopherbell_mongo_data: {}
