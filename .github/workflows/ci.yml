name: CI Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Auto-deploy waits for a CI run on each main commit. If GitHub drops a push event,
  # run this workflow on main from the Actions tab to unblock the deploy.
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        timeout-minutes: 5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Gradle
        timeout-minutes: 5
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # PowerShell Gallery outages have failed main builds on unchanged trees; a cached
      # module avoids the Gallery entirely and retries absorb transient misses.
      - name: Cache Pester 5.9.0
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Documents/PowerShell/Modules/Pester/5.9.0
          key: pester-5.9.0-${{ runner.os }}

      - name: Install Pester 5.9.0
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredPesterVersion = [version]'5.9.0'
          $maximumInstallAttempts = 3
          $retryDelaysInSeconds = @(15, 45)
          $installedPester = Get-Module -ListAvailable -Name Pester |
            Where-Object Version -eq $requiredPesterVersion
          if ($installedPester) {
            Write-Output "Using cached Pester $requiredPesterVersion."
          } else {
            for ($installAttempt = 1; $installAttempt -le $maximumInstallAttempts; $installAttempt++) {
              try {
                Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force -SkipPublisherCheck
                break
              } catch {
                if ($installAttempt -eq $maximumInstallAttempts) { throw }
                $retryDelayInSeconds = $retryDelaysInSeconds[$installAttempt - 1]
                Write-Warning ("Pester install attempt $installAttempt of $maximumInstallAttempts failed: " +
                  "$($_.Exception.Message) Retrying in $retryDelayInSeconds seconds.")
                Start-Sleep -Seconds $retryDelayInSeconds
              }
            }
          }
          Import-Module Pester -RequiredVersion 5.9.0 -Force -ErrorAction Stop
          if ((Get-Module Pester).Version -ne $requiredPesterVersion) {
            throw 'Required Pester 5.9.0 module failed to load.'
          }

      - name: Build and Test
        timeout-minutes: 20
        run: .\gradlew.bat build

      - name: Summarize test results
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/Write-TestSummary.ps1 -ResultsRoot . -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload failed test reports
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-windows-java-25
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/test-results/shared-folder-pester/*.xml
            **/build/reports/problems/**
