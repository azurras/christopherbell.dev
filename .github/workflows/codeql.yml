name: CodeQL

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 7 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: test
          POSTGRES_USER: christopherbell_test
          # Disposable job-local database credential; this is not a production secret.
          POSTGRES_PASSWORD: ${{ format('ci-only-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U christopherbell_test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        if: matrix.language == 'java-kotlin'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'java-kotlin'
        env:
          JOOQ_CODEGEN_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/test
          JOOQ_CODEGEN_USERNAME: christopherbell_test
          JOOQ_CODEGEN_PASSWORD: ${{ format('ci-only-{0}-{1}', github.run_id, github.run_attempt) }}
          JOOQ_CODEGEN_SCHEMA_PREFIX: cbtest_codeql_${{ github.run_id }}_${{ github.run_attempt }}_
        run: ./gradlew :website:jooqCodegen :website:classes
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: '/language:${{ matrix.language }}'
