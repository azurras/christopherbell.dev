<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <th:block th:replace="~{fragments/social-preview :: socialPreview('CB | Forgot Password', 'Request a password reset for your christopherbell.dev account.', 'https://www.christopherbell.dev/forgot-password', 'https://www.christopherbell.dev/images/previews/christopherbell-dev.png', 'The Void preview for christopherbell.dev')}"></th:block>
  <title>Forgot Password</title>
  <link rel="stylesheet" type="text/css" href="/css/main.css" th:href="@{/css/main.css}"/>
</head>
<body class="site-page auth-page">
  <div id="nav"></div>
  <main class="auth-shell" role="main">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="auth-heading">
          <p class="home-kicker">Account access</p>
          <h1>Reset password</h1>
          <p>Enter your email and we will send a reset link if the account exists.</p>
        </div>
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div id="forgotPasswordAlert" class="alert d-none" role="alert"></div>
            <form id="forgotPasswordForm" method="post" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="name@example.com" required />
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Send reset link</button>
                <a class="btn btn-outline-secondary" href="/login">Back to login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="/js/app.js" th:src="@{/js/app.js}"></script>
  <script type="module" src="/js/auth/forgot-password.js" th:src="@{/js/auth/forgot-password.js}"></script>
  <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
</body>
</html>
