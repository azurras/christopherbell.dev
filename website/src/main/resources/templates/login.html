<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <th:block th:replace="~{fragments/social-preview :: socialPreview('CB | Login', 'Sign in to the Void on christopherbell.dev.', 'https://www.christopherbell.dev/login', 'https://www.christopherbell.dev/images/previews/christopherbell-dev.png', 'The Void preview for christopherbell.dev')}"></th:block>
  <title>Login</title>
  <link rel="stylesheet" type="text/css" href="/css/main.css" th:href="@{/css/main.css}"/>
</head>
<body class="site-page auth-page">
  <div id="nav"></div>
  <main class="auth-shell" role="main">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="auth-heading">
          <p class="home-kicker">Welcome back</p>
          <h1>Sign in</h1>
          <p>Get back to posting, profile tools, and the admin bits if you have access.</p>
        </div>
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required />
                <div class="form-text"><a href="/forgot-password">Forgot password?</a></div>
              </div>
              <div class="d-grid gap-2">
                <button id="loginBtn" type="submit" class="btn btn-primary">Login</button>
                <a class="btn btn-outline-secondary" href="/signup">Sign up</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="/js/app.js" th:src="@{/js/app.js}"></script>
  <script type="module" src="/js/auth/login.js" th:src="@{/js/auth/login.js}"></script>
  <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
