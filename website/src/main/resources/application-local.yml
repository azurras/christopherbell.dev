server:
  port: 8081
command-center:
  actions:
    mode: SIMULATED
    power-actions-enabled: true
app:
  request-size:
    default-max: ${APP_REQUEST_SIZE_DEFAULT_MAX:2MB}
  shared-folder:
    root: build/shared-folder/local/shared
    system-root: build/shared-folder/local/system
  music:
    root: build/shared-folder/local/shared/Music
    artwork-cache-root: build/shared-folder/local/system/music-artwork
    media-tools:
      root: build/shared-folder/local/system/shared-folder-media-tools
    metadata:
      private-root: build/shared-folder/local/system/music-metadata
spring:
  mongodb:
    database: christopherbell
    uri: mongodb://localhost:27017
  data:
    mongodb:
      auto-index-creation: true
