server:
  port: 8080
  forward-headers-strategy: none
spring:
  mongodb:
    database: ${SPRING_MONGODB_DATABASE:christopherbell}
    uri: ${SPRING_MONGODB_URI:}
  data:
    mongodb:
      auto-index-creation: true
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  request-size:
    default-max: ${APP_REQUEST_SIZE_DEFAULT_MAX:1MB}
  browser-security:
    public-base-url: ${APP_PUBLIC_BASE_URL:https://www.christopherbell.dev}
    authentication-cookie-secure: true
    hsts-enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:}
  shared-folder:
    root: ${APP_SHARED_FOLDER_ROOT:A:/Shared}
    system-root: ${APP_SHARED_FOLDER_SYSTEM_ROOT:A:/Shared-System}
  music:
    root: ${APP_MUSIC_ROOT:A:/Shared/Music}
    artwork-cache-root: ${APP_MUSIC_ARTWORK_CACHE_ROOT:A:/Shared-System/music-artwork}
    media-tools:
      root: ${APP_MUSIC_MEDIA_TOOLS_ROOT:A:/Shared-System/shared-folder-media-tools}
    metadata:
      private-root: ${APP_MUSIC_METADATA_PRIVATE_ROOT:A:/Shared-System/music-metadata}
    ffprobe-command: ${APP_MUSIC_FFPROBE_COMMAND:ffprobe}
    ffmpeg-command: ${APP_MUSIC_FFMPEG_COMMAND:ffmpeg}
    enabled: ${APP_MUSIC_ENABLED:true}
command-center:
  enabled: true
  sensor-libraries-enabled: true
  sensor-library-directory: C:/ProgramData/christopherbell.dev/config/command-center-sensors
  log-path: C:/ProgramData/christopherbell.dev/logs/ChristopherBellDev.out.log
  actions:
    mode: WINDOWS
    power-actions-enabled: ${COMMAND_CENTER_POWER_ACTIONS_ENABLED:false}
    win-sw-executable: C:/ProgramData/christopherbell.dev/service/ChristopherBellDev.exe
    shutdown-executable: C:/Windows/System32/shutdown.exe
    power-delay: 60s
